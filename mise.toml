# This repository's own tasks; its tools are the workspace's, read by walking up, and Nix's own are
# what flake.lock pins.
[env]
_.path = ['''{{exec(command="if [ -f '" ~ config_root ~ "/scripts/channel/channel.res.mjs' ]; then node '" ~ config_root ~ "/scripts/channel/channel.res.mjs' path --lock '" ~ config_root ~ "'; else echo 'channel: compiled resolver missing; using /nix/var/nix/profiles/default' >&2; echo /nix/var/nix/profiles/default; fi")}}/bin''', "{{config_root}}/node_modules/.bin", "/nix/var/nix/profiles/default/bin"]

# What oxfmt formats here.
[vars]
formatted = "README.md 'docs/**/*.md'"

[tasks.fmt]
description = "Format the Nix with nixfmt, the scripts with ReScript's formatter and the prose with oxfmt: `fmt [--dry-run]`"
usage = 'flag "-n --dry-run" help="List what is not formatted and write nothing"'
run = """
if [ -z "${usage_dry_run:-}" ]; then rescript format && oxfmt {{vars.formatted}} && mise run nixfmt; exit; fi
rescript format --check; oxfmt --list-different {{vars.formatted}}; mise run nixfmt --check; exit 0
"""

# Nix reads a flake's files from git's index, which jj leaves without what @ adds, so each Nix task
# reads a copy of the flake's own files instead, the workspace's docs/lessons.md.
[tasks.nixfmt]
description = "Format the Nix with nixfmt, as flake.lock pins it: `nixfmt [--check]`"
usage = 'flag "--check" help="Fail where anything is not formatted, and write nothing"'
run = """
t=$(realpath "$(mktemp -d)") && cp flake.nix flake.lock "$t/" || exit 1
nix run --inputs-from "path:$t" nixpkgs#nixfmt -- ${usage_check:+--check} $(find flake.nix system local .github -name '*.nix')
"""

[tasks.nixed]
description = "Lint the Nix with statix and deadnix and evaluate the flake for every system"
run = """
t=$(realpath "$(mktemp -d)") && rsync -a --exclude=.jj --exclude=.git --exclude=node_modules --include='*/' --include='*.nix' --include='*.lock' --exclude='*' --prune-empty-dirs ./ "$t/" || exit 1
n() { p=$1; shift; nix run --inputs-from "path:$t" "nixpkgs#$p" -- "$@"; }
n statix check "$t" && n deadnix --fail "$t" && nix flake check --all-systems --no-build "path:$t"
"""

# The actions and the runtimes' images are the workspace's movers, workspace.toml's [update].
[tasks.update]
description = "Move the flake's inputs to their branches' heads: `update [--dry-run] [--major]`"
usage = '''
flag "-n --dry-run" help="Say what would move and write nothing"
flag "--major" help="Taken by the workspace's movers; a newer NixOS release is still an edit to flake.nix"
'''
run = """
t=$(realpath "$(mktemp -d)") && cp flake.nix flake.lock "$t/" && nix flake update --flake "path:$t" || exit 1
! cmp -s flake.lock "$t/flake.lock" || echo "update: each input at its branch's head"
[ -n "${usage_dry_run:-}" ] || cp "$t/flake.lock" flake.lock
[ -z "${usage_major:-}" ] || echo "update: a newer NixOS release is an edit to flake.nix"
"""

# The builder and the local machine, each a container in Docker on this computer, RFC n0o4l.
[tasks.builder]
description = "Start or stop the builder, the container every machine's system is built in: `builder <up|down> [--dry-run]`"
usage = '''
arg "<action>" help="up, started anew on its volume, or down, its store kept" {
  choices "up" "down"
}
flag "-n --dry-run" help="Say what would be done and change nothing"
'''
run = 'rescript build > /dev/null && node scripts/builder.res.mjs "$usage_action" ${usage_dry_run:+--dry-run}'

[tasks.local]
description = "Start, switch or stop the local machine, a test machine in a container reached on localhost:2222: `local <up|down> [--dry-run]`"
usage = '''
arg "<action>" help="up, started or switched to this checkout's local/, or down, its store and state kept" {
  choices "up" "down"
}
flag "-n --dry-run" help="Say what would be done and change nothing"
'''
run = 'rescript build > /dev/null && node scripts/local.res.mjs "$usage_action" ${usage_dry_run:+--dry-run}'

[tasks.clean]
description = "Remove what ReScript built, never an installed dependency or local state: `clean [--dry-run]`"
usage = '''
flag "-n --dry-run" help="List what would go and remove nothing"
'''
depends = ["//:build"]
run = "node {{env.WORKSPACE}}/scripts/clean.res.mjs"

[tasks.verify]
description = "What a commit has to pass: everything formatted, the scripts compiled, the Nix linted, the flake evaluated for every system, the cache's and the seed's tests run; the workflows are the workspace's check"
run = ["oxfmt --check {{vars.formatted}}", "rescript format --check && rescript build", "mise run nixfmt --check", "mise run nixed", "bash system/nix/cache/tests/tests.sh && bash system/nix/update/tests/fetch-test.sh && bash system/nix/update/tests/driver-test.sh && bash system/nix/update/tests/driver-eval-test.sh && bash system/nix/update/tests/eval-test.sh && bash system/nix/update/tests/nudge-eval-test.sh && bash system/nix/update/tests/nudge-test.sh && bash system/network/seed/tests.sh && bash system/network/tests.sh && nix eval --impure --json --file system/names-test.nix --apply 'f: f {}' && nix eval --impure --json --file system/time/eval-test.nix --apply 'f: f {}' && nix eval --impure --json --file system/nix/collect-test.nix --apply 'f: f {}' && bash .github/update/driver-test.sh"]

[tasks.channel]
description = "Use the lock's Nix and align the daemon with it"
run = 'rescript build > /dev/null && node {{config_root}}/scripts/channel/channel.res.mjs'

[tasks.test]
description = "Test the channel resolver with a faked filesystem and commands"
run = "rescript build > /dev/null && node --test 'scripts/channel/*_test.res.mjs'"
