# What a crate may depend on, checked by `cargo deny check` in verify, the licenses monoflake/driver
# allows, RFC fhg6w, so a copyleft one is refused; harmonia alone is taken from git, RFC cbtjl.
[graph]
all-features = true
# The targets a crate is built for, the machines' two and the Mac its tests run on.
targets = [
	"x86_64-unknown-linux-gnu",
	"aarch64-unknown-linux-gnu",
	"aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
	"0BSD",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	# minicbor's, RFC fhg6w, permissive and OSI approved, read 2026-10-19 in
	# docs/lessons/languages.md.
	"BlueOak-1.0.0",
	"CC0-1.0",
	"ISC",
	"MIT",
	# aws-lc-sys's, HTTPS's default provider, allowed here alone, RFC cbtjl.
	"OpenSSL",
	"Unicode-3.0",
	"Zlib",
]
confidence-threshold = 0.93

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/nix-community/harmonia"]
