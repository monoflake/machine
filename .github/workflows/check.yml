# What verify runs, the flake evaluated for every system and never built, woken by update.
# The Rust is linted and tested.
name: check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: repos/monoflake/machine
    steps:
      - uses: canmi21/canmi/.github/actions/workspace@main
        with:
          path: monoflake/machine
          scripts: true

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.3 # The installer only bootstraps.

      - name: take the channel's nix
        run: |
          pnpm install --frozen-lockfile
          mise run channel daemon

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: repos/monoflake/machine -> target

      - name: cargo fmt
        run: mise exec -- cargo fmt --check

      - name: clippy
        run: mise exec -- cargo clippy --all-targets -- -D warnings

      - name: clippy with ring
        run: mise exec -- cargo clippy --all-targets --no-default-features --features ring -- -D warnings

      - name: test
        run: mise exec -- cargo test

      - name: test with ring
        run: mise exec -- cargo test --no-default-features --features ring

      - name: cargo deny
        run: mise exec -- cargo deny check

      - name: nixfmt
        run: mise run nixfmt --check

      - name: lint and evaluate
        run: mise run nixed
