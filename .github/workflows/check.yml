# Checks the Rust and evaluates the flake for every system without building, woken by update.
name: check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: repos/monoflake/machine
    steps:
      - uses: canmi21/canmi/.github/actions/workspace@main
        with:
          path: monoflake/machine
          nix: "true"

      - name: Install the packages
        run: pnpm install --frozen-lockfile

      - name: Take the channel's nix
        run: mise run channel daemon

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: repos/monoflake/machine -> target

      - name: Cargo fmt
        run: mise run rust:fmt

      - name: Clippy
        run: mise run rust:clippy

      - name: Clippy with ring
        run: mise run rust:clippy --ring

      - name: Test
        run: mise run rust:test

      - name: Test with ring
        run: mise run rust:test --ring

      - name: Doctests
        run: mise run rust:doc

      - name: Cargo deny
        run: mise run rust:deny

      - name: Nixfmt
        run: mise run nixfmt --check

      - name: Lint and evaluate
        run: mise run nixed
