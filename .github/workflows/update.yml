# Moves the declared inputs through the workspace update and verify, then wakes check.
name: update

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: update

jobs:
  update:
    uses: canmi21/canmi/.github/workflows/update-repository.yml@main
    with:
      path: monoflake/machine
      nix: true
      prepare: mise run prepare
      message: mise run message "$RUNNER_TEMP/message"
      wake: check.yml
