# The workspace this repository sits under, whose rules and linked configuration it takes.
base = "https://github.com/canmi21/canmi.git"

# What a push of it declares, read by the workspace's push, its docs/agents/pushing.md.
[push]
visibility = "public"

# What the workspace's update moves here besides this repository's own task, its
# docs/toolchain/dependencies.md.
# What this repository exports and what it depends on, RFC 8q1af.
[boundary]
exports = ["machine-flake"]
depends = ["monoflake/driver:driver-archive"]

[update]
actions = true
releases = ["system/containers/manifest.toml"]

# The id space its docs/rfcs holds RFCs in, the workspace's scripts/rfcs reading it.
[rfcs]
ids = "monoflake"

# Suffixes this repository alone tracks, formatted by nothing, the workspace's
# docs/toolchain/lint-format.md.
[format]
unformatted = [".jq", ".narinfo", ".patch", ".pub", ".sig", ".zst"]
